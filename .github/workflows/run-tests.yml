name: Run Tests (reusable)

on:
  workflow_call:
    inputs:
      antares_version:
        description: 'Antares Simulator version to test against (leave empty to read from dependencies.json)'
        required: false
        type: string
        default: ''
      antares_craft_version:
        description: 'antares-craft version to override the pinned version (leave empty to use pinned)'
        required: false
        type: string
        default: ''
      gemspy_version:
        description: 'GemsPy version to override the pinned version (leave empty to use pinned)'
        required: false
        type: string
        default: ''
      views_builder_version:
        description: 'GEMS-ViewsBuilder version to override the pinned version (leave empty to use pinned)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Name for the uploaded artifact on failure'
        required: false
        type: string
        default: 'test-failures'
      run_code_quality:
        description: 'Run mypy and black checks before tests'
        required: false
        type: boolean
        default: false
    outputs:
      test_outcome:
        description: 'Outcome of the test run (success or failure)'
        value: ${{ jobs.tests.outputs.test_outcome }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    outputs:
      # A failed consistency check stops the job before the test run, which is then skipped.
      test_outcome: ${{ steps.consistency.outcome == 'failure' && 'failure' || steps.run_tests.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install dependencies
        env:
          UV_PYTHON: python
          UV_NO_MANAGED_PYTHON: "true"
        run: uv sync --group dev

      - name: Type checking
        if: inputs.run_code_quality
        run: uv run mypy src/

      - name: Check formatting
        if: inputs.run_code_quality
        run: uv run black --check --diff src/

      - name: Override antares-craft version
        if: inputs.antares_craft_version != ''
        run: uv pip install "antares-craft==${{ inputs.antares_craft_version }}"

      - name: Override GemsPy version
        if: inputs.gemspy_version != ''
        run: uv pip install "gemspy==${{ inputs.gemspy_version }}"

      - name: Override GEMS-ViewsBuilder version
        if: inputs.views_builder_version != ''
        run: uv pip install "gems-views-builder==${{ inputs.views_builder_version }}"

      # Libraries, catalogs, taxonomies and view configs: no Antares binary needed,
      # so they run first and fail fast. The test run below skips them.
      - name: Consistency checks
        id: consistency
        run: uv run pytest tests/consistency -v --tb=short

      - name: Resolve Antares version for downstream steps
        id: resolve_version
        run: |
          VERSION="${{ inputs.antares_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r '.antares_simulator_version' dependencies.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Antares release
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"
          ARCHIVE="antares-${VERSION}-Ubuntu-22.04.tar.gz"
          echo "Downloading Antares v${VERSION}..."
          curl -L -f -o "${ARCHIVE}" \
            "https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download/v${VERSION}/${ARCHIVE}"
          echo "Download successful. File size: $(ls -lh "${ARCHIVE}" | awk '{print $5}')"

      - name: Extract Antares binaries
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"
          tar -xzf "antares-${VERSION}-Ubuntu-22.04.tar.gz"

      - name: Run tests
        id: run_tests
        run: uv run pytest -n auto --ignore=tests/consistency --cov=antares_gems_converter --cov=antares_runner --cov-report=xml -v --tb=short
        continue-on-error: true

      - name: Upload test artifacts on failure
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            **/*.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"
          rm -f "antares-${VERSION}-Ubuntu-22.04.tar.gz"
          rm -rf "antares-${VERSION}-Ubuntu-22.04"

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
