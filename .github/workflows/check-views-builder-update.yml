name: Check GEMS-ViewsBuilder Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read last validated GEMS-ViewsBuilder version
        id: current
        run: |
          VERSION=$(jq -r '.views_builder_version' views_builder_version.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Fetch latest GEMS-ViewsBuilder release from PyPI
        id: latest
        run: |
          RESPONSE=$(curl -sf "https://pypi.org/pypi/gems-views-builder/json")

          if [ -z "$RESPONSE" ]; then
            echo "ERROR: Could not fetch gems-views-builder info from PyPI"
            exit 1
          fi

          LATEST=$(echo "$RESPONSE" | jq -r '.info.version')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Could not parse latest gems-views-builder version"
            exit 1
          fi

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest gems-views-builder version: $LATEST"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          echo "Current: $CURRENT  |  Latest: $LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $LATEST"
          fi

      - name: Create GitHub Issue
        if: steps.compare.outputs.update == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const latest = '${{ steps.latest.outputs.version }}';
            const current = '${{ steps.current.outputs.version }}';
            const title = `[A2G-02] GEMS-ViewsBuilder update: v${latest}`;
            const label = 'views-builder-update';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            const duplicate = existing.data.find(i => i.title.includes(`v${latest}`));
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} - ${duplicate.html_url}`);
              return;
            }

            // Make sure the label exists (issue creation fails on unknown labels in some setups)
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'ededed',
              });
            } catch (e) {
              console.log(`Label '${label}' not created (probably already exists): ${e.message}`);
            }

            const body = [
              '> This issue was automatically created by the `check-views-builder-update` workflow.',
              '',
              '## New Version Detected',
              '',
              '| | |',
              '|---|---|',
              `| **Last validated version** | \`${current}\` |`,
              `| **New version** | \`${latest}\` |`,
              `| **PyPI page** | https://pypi.org/project/gems-views-builder/${latest}/ |`,
              '| **Repository** | https://github.com/AntaresSimulatorTeam/GEMS-ViewsBuilder |',
              '',
              '## Triage',
              '',
              'Check that the catalogs (`src/antares_gems_converter/catalogs/`) are still in the right format and compatible with the new GEMS-ViewsBuilder version.',
              '',
              '- [ ] GEMS-ViewsBuilder changelog reviewed (catalog / taxonomy schema changes?)',
              '- [ ] Catalogs (`catalogs/*.yml`) are in the expected format and compatible with the new version',
              '- [ ] Taxonomies (`taxonomies/`, including the flattened one) are up to date; remove the flattened taxonomy if parent categories are now supported',
              '- [ ] `uv run pytest tests/antares_historic/test_catalogs.py` passes',
              '- [ ] `views_builder_version.json` updated to the new version',
              '- [ ] Version bump, changelog and `COMPATIBILITY.md` updated if shipped files changed',
              '- [ ] No action needed (if release has no impact on the catalogs)',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['A2G-02', label],
            });

            console.log(`Issue created: #${result.data.number} - ${result.data.html_url}`);
