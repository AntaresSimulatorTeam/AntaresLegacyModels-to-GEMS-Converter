library:
  id: antares_legacy_investment_candidates
  description: >-
    Investment candidates on Antares legacy objects, for hybrid studies solved
    with Antares Xpansion. Each candidate decides an invested capacity, either
    continuous or as an integer number of units of fixed size. Its capacity
    port is connected to a legacy object of the study, and only Antares
    thermal clusters can be connected for now (thermal-capacity-connections).
    These models do not represent any production or consumption themselves.
    Their investment variables are scenario-independent: a study using them
    needs an optim-config.yml with resolution-mode benders-decomposition, and
    a solver supporting integer variables for the discrete model.
  version: "1.0.0"
  taxonomy: antares_legacy_taxonomy

  port-types:
    - id: capacity_port
      description: >-
        Available capacity of the connected Antares legacy object, in MW. It
        replaces the availability of the connected thermal cluster.
      fields:
        - id: capacity
      thermal-capacity-connection:
        capacity-field: capacity

  models:
    - id: continuous_investment_candidate
      description: >-
        Continuous invested capacity (MW), between min_investment and
        max_investment (MW). existing_capacity (MW) is already installed and
        has no investment cost. The capacity given to the connected object is
        (existing_capacity + invested_capacity) * availability_rate, where
        availability_rate is the available fraction (between 0 and 1), per hour
        and scenario. annual_investment_cost is in currency per MW per year.
      parameters:
        - id: existing_capacity
          time-dependent: false
          scenario-dependent: false
        - id: min_investment
          time-dependent: false
          scenario-dependent: false
        - id: max_investment
          time-dependent: false
          scenario-dependent: false
        - id: annual_investment_cost
          time-dependent: false
          scenario-dependent: false
        - id: availability_rate
          time-dependent: true
          scenario-dependent: true
      variables:
        - id: invested_capacity
          variable-type: continuous
          lower-bound: min_investment
          upper-bound: max_investment
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: capacity_port
          type: capacity_port
      port-field-definitions:
        - port: capacity_port
          field: capacity
          definition: (existing_capacity + invested_capacity) * availability_rate
      objective-contributions:
        - id: objective
          expression: annual_investment_cost * invested_capacity

    - id: discrete_investment_candidate
      description: >-
        Integer number of invested units of unit_size (MW), whose invested
        capacity unit_size * invested_units is between min_investment and
        max_investment (MW). existing_capacity (MW) is already installed and
        has no investment cost. The capacity given to the connected object is
        (existing_capacity + unit_size * invested_units) * availability_rate,
        where availability_rate is the available fraction (between 0 and 1),
        per hour and scenario. annual_investment_cost is in currency per MW per
        year, not per unit.
      parameters:
        - id: unit_size
          time-dependent: false
          scenario-dependent: false
        - id: existing_capacity
          time-dependent: false
          scenario-dependent: false
        - id: min_investment
          time-dependent: false
          scenario-dependent: false
        - id: max_investment
          time-dependent: false
          scenario-dependent: false
        - id: annual_investment_cost
          time-dependent: false
          scenario-dependent: false
        - id: availability_rate
          time-dependent: true
          scenario-dependent: true
      variables:
        # Integrality rounds the bounds inwards: unit_size * invested_units
        # stays within [min_investment, max_investment]
        - id: invested_units
          variable-type: integer
          lower-bound: min_investment / unit_size
          upper-bound: max_investment / unit_size
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: capacity_port
          type: capacity_port
      port-field-definitions:
        - port: capacity_port
          field: capacity
          definition: (existing_capacity + unit_size * invested_units) * availability_rate
      objective-contributions:
        - id: objective
          expression: annual_investment_cost * unit_size * invested_units
