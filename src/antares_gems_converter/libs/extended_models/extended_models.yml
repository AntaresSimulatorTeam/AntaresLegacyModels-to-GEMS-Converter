# This file is part of the Antares project.
#
# Models that are NOT in antares_legacy_models.yml, to be used next to it.
# The area, load, link, renewable and thermal ("accurate") models are taken from
# antares_legacy_models.yml: this library only holds variants and new constructs.
library:
  id: extended_models
  description: Models to use next to the Antares legacy model library (MILP and fast thermal clusters, storage with cycle limits, curtailable renewables, nuclear binding constraints)
  version: "1.0.0"
  taxonomy: antares_legacy_taxonomy

  # Same port type as antares_legacy_models.flow, so that the components of both
  # libraries can be connected, and connected to legacy areas in HYBRID mode.
  port-types:
    - id: flow
      description: A port that transfers power flow.
      fields:
        - id: flow
        - id: price
        - id: spillage_bound # Generation that may be spilled in the area (positive), as in the legacy "fictitious load" constraint
        - id: unsupplied_energy_bound # Load that may be left unsupplied in the area (positive), as in the legacy bound on unsupplied energy
      area-connection:
        injection-to-balance: flow
        spillage-bound: spillage_bound
        unsupplied-energy-bound: unsupplied_energy_bound

  models:
    # antares_legacy_models.thermal with integer unit-commitment variables.
    - id: thermal_milp
      parameters:
        - id: cluster_min_gen_modulation
          scenario-dependent: true
          time-dependent: true
        - id: cluster_max_generation
          scenario-dependent: true
          time-dependent: true
        - id: min_power_per_unit
        - id: max_power_per_unit
        - id: generation_cost
        - id: startup_cost
        - id: fixed_cost
        - id: min_up_duration # Bound of a time sum, so must not depend on time.
          time-dependent: false
          scenario-dependent: false
        - id: min_down_duration # Bound of a time sum, so must not depend on time.
          time-dependent: false
          scenario-dependent: false
        - id: num_units
        - id: spinning # in percentage
      variables:
        - id: generation_power
          lower-bound: min(max(cluster_max_generation * (1 - spinning / 100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit)), cluster_min_gen_modulation * num_units * max_power_per_unit)
          upper-bound: max(cluster_max_generation * (1 - spinning / 100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit))
          variable-type: continuous
        - id: num_units_on
          lower-bound: ceil(min(cluster_max_generation / max_power_per_unit, cluster_min_gen_modulation * num_units * max_power_per_unit / (max_power_per_unit * (1 - spinning / 100))))
          upper-bound: ceil(cluster_max_generation / max_power_per_unit)
          variable-type: integer
        - id: num_units_starting
          lower-bound: 0
          variable-type: integer
        - id: num_units_stopping
          lower-bound: 0
          variable-type: integer
        - id: num_units_failing
          lower-bound: 0
          upper-bound: max(0, (ceil(cluster_max_generation / max_power_per_unit))[t-1] - ceil(cluster_max_generation / max_power_per_unit))
          variable-type: integer
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: generation_power
        - port: balance_port
          field: spillage_bound
          definition: generation_power # Dispatchable generation may be spilled
        - port: balance_port
          field: unsupplied_energy_bound
          definition: 0
      constraints:
        - id: max_generation
          expression: generation_power <= num_units_on * max_power_per_unit * (1 - spinning / 100)
        - id: min_generation
          expression: generation_power >= num_units_on * min_power_per_unit
        - id: on_units_dynamics
          expression: num_units_on = num_units_on[t-1] + num_units_starting - num_units_stopping
        - id: num_units_failing_lower_than_stopping
          expression: num_units_failing <= num_units_stopping
        - id: min_up_duration_cst
          expression: sum(t-min_up_duration+1 .. t, num_units_starting - num_units_failing) <= num_units_on
        - id: min_down_duration_cst
          expression: sum(t-min_down_duration+1 .. t, num_units_stopping) <= (ceil(cluster_max_generation / max_power_per_unit))[t-min_down_duration] - num_units_on + sum(t-min_down_duration+1 .. t, max(0, ceil(cluster_max_generation / max_power_per_unit) - (ceil(cluster_max_generation / max_power_per_unit))[t-1]))
      objective-contributions:
        - id: objective
          expression: sum(generation_cost * generation_power + startup_cost * num_units_starting + fixed_cost * num_units_on)

    # Thermal cluster without unit commitment: only the generation bounds of
    # antares_legacy_models.thermal are kept.
    - id: thermal_fast
      parameters:
        - id: cluster_min_gen_modulation
          scenario-dependent: true
          time-dependent: true
        - id: cluster_max_generation
          scenario-dependent: true
          time-dependent: true
        - id: min_power_per_unit
        - id: max_power_per_unit
        - id: generation_cost
        - id: num_units
        - id: spinning # in percentage
      variables:
        - id: generation_power
          lower-bound: min(max(cluster_max_generation * (1 - spinning / 100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit)), cluster_min_gen_modulation * num_units * max_power_per_unit)
          upper-bound: max(cluster_max_generation * (1 - spinning / 100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit))
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: generation_power
        - port: balance_port
          field: spillage_bound
          definition: generation_power # Dispatchable generation may be spilled
        - port: balance_port
          field: unsupplied_energy_bound
          definition: 0
      objective-contributions:
        - id: objective
          expression: sum(generation_cost * generation_power)

    # Short-term storage with a hurdle cost, a McCormick cut against simultaneous
    # injection and withdrawal, and daily cycle limits.
    # The level at t is the level BEFORE the flows of t (level[0] is the initial level),
    # unlike antares_legacy_models.short_term_storage.
    # The daily cycle limits assume a weekly horizon (time steps 0 to 167).
    - id: short_term_storage_extended
      parameters:
        - id: reservoir_capacity
          time-dependent: false
          scenario-dependent: false
        - id: nominal_injection_capacity
          time-dependent: false
          scenario-dependent: false
        - id: nominal_withdrawal_capacity
          time-dependent: false
          scenario-dependent: false
        - id: injection_efficiency
          time-dependent: false
          scenario-dependent: false
        - id: withdrawal_efficiency
          time-dependent: false
          scenario-dependent: false
        - id: lower_rule_curve
          time-dependent: true
          scenario-dependent: true
        - id: upper_rule_curve
          time-dependent: true
          scenario-dependent: true
        - id: max_injection_modulation
          time-dependent: true
          scenario-dependent: true
        - id: max_withdrawal_modulation
          time-dependent: true
          scenario-dependent: true
        - id: inflows
          time-dependent: true
          scenario-dependent: true
        - id: initial_level
          time-dependent: false
          scenario-dependent: true
        - id: injection_cost
          time-dependent: true
          scenario-dependent: true
        - id: withdrawal_cost
          time-dependent: true
          scenario-dependent: true
        - id: level_cost
          time-dependent: true
          scenario-dependent: true
        - id: hurdle_cost # Added to the injection and withdrawal costs, against simultaneous injection and withdrawal
          time-dependent: false
          scenario-dependent: false
        - id: is_mccormick_enabled # 1 to add the McCormick cut, 0 otherwise
          time-dependent: false
          scenario-dependent: false
        - id: withdrawal_power_at_max_injection # Withdrawal allowed by the McCormick cut at maximum injection: 0 for the usual cut (620 for Grand'Maison)
          time-dependent: false
          scenario-dependent: false
        - id: is_cycle_limited # 1 to limit the daily cycles, 0 otherwise
          time-dependent: false
          scenario-dependent: false
        - id: max_daily_cycles # Maximum number of daily cycles (injected or withdrawn energy over reservoir capacity)
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: injection_power
          lower-bound: 0
          upper-bound: max_injection_modulation * nominal_injection_capacity
          variable-type: continuous
        - id: withdrawal_power
          lower-bound: 0
          upper-bound: max_withdrawal_modulation * nominal_withdrawal_capacity
          variable-type: continuous
        - id: level
          lower-bound: lower_rule_curve * reservoir_capacity
          upper-bound: upper_rule_curve * reservoir_capacity
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: withdrawal_power - injection_power
        - port: balance_port
          field: spillage_bound
          definition: withdrawal_power # Withdrawn energy may be spilled, injected energy does not reduce the bound
        - port: balance_port
          field: unsupplied_energy_bound
          definition: 0
      constraints:
        - id: initial_level_constraint
          expression: level[0] = initial_level * reservoir_capacity
        - id: level_equation
          expression: level[t+1] = level + injection_efficiency * injection_power - withdrawal_efficiency * withdrawal_power + inflows
        # Cuts the corner (max injection, max withdrawal) of the feasible set,
        # through (max injection, withdrawal_power_at_max_injection) and (0, max withdrawal).
        - id: mccormick
          expression: is_mccormick_enabled * (injection_power * (max_withdrawal_modulation * nominal_withdrawal_capacity - withdrawal_power_at_max_injection) + withdrawal_power * max_injection_modulation * nominal_injection_capacity) <= max_injection_modulation * nominal_injection_capacity * max_withdrawal_modulation * nominal_withdrawal_capacity
        - id: max_daily_injection_1
          expression: is_cycle_limited * injection_efficiency * sum(0 .. 23, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_2
          expression: is_cycle_limited * injection_efficiency * sum(24 .. 47, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_3
          expression: is_cycle_limited * injection_efficiency * sum(48 .. 71, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_4
          expression: is_cycle_limited * injection_efficiency * sum(72 .. 95, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_5
          expression: is_cycle_limited * injection_efficiency * sum(96 .. 119, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_6
          expression: is_cycle_limited * injection_efficiency * sum(120 .. 143, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_injection_7
          expression: is_cycle_limited * injection_efficiency * sum(144 .. 167, injection_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_1
          expression: is_cycle_limited * withdrawal_efficiency * sum(0 .. 23, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_2
          expression: is_cycle_limited * withdrawal_efficiency * sum(24 .. 47, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_3
          expression: is_cycle_limited * withdrawal_efficiency * sum(48 .. 71, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_4
          expression: is_cycle_limited * withdrawal_efficiency * sum(72 .. 95, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_5
          expression: is_cycle_limited * withdrawal_efficiency * sum(96 .. 119, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_6
          expression: is_cycle_limited * withdrawal_efficiency * sum(120 .. 143, withdrawal_power) <= max_daily_cycles * reservoir_capacity
        - id: max_daily_withdrawal_7
          expression: is_cycle_limited * withdrawal_efficiency * sum(144 .. 167, withdrawal_power) <= max_daily_cycles * reservoir_capacity
      objective-contributions:
        - id: objective
          expression: sum((hurdle_cost + injection_cost) * injection_power + (hurdle_cost + withdrawal_cost) * withdrawal_power + level_cost * level)

    # Curtailment of a renewable generation modelled elsewhere (e.g. by a renewable
    # cluster): the curtailed power is withdrawn from the area.
    - id: curtailable_renewable
      parameters:
        - id: generation_cost # Negative price of the renewable generation: curtailing saves -generation_cost per MWh
          time-dependent: false
          scenario-dependent: false
        - id: load_factor # Between 0 and 1
          time-dependent: true
          scenario-dependent: true
        - id: installed_capacity
          time-dependent: false
          scenario-dependent: false
        - id: non_curtailable_share # Between 0 and 1
          time-dependent: true
          scenario-dependent: true
      variables:
        - id: curtailed_power
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * (1 - non_curtailable_share)
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: -curtailed_power
        - port: balance_port
          field: spillage_bound
          definition: 0
        - port: balance_port
          field: unsupplied_energy_bound
          definition: 0
      objective-contributions:
        - id: objective
          expression: sum(-generation_cost * curtailed_power)
      extra-outputs:
        - id: non_curtailable_power
          expression: load_factor * installed_capacity * non_curtailable_share
        - id: non_curtailed_power # Curtailable power that is not curtailed
          expression: load_factor * installed_capacity * (1 - non_curtailable_share) - curtailed_power

    # Curtailment in 5 bands, each with its own share and cost. The bands are
    # independent: this model is equivalent to 5 curtailable_renewable components
    # (non_curtailable_share = 1 - curtailable_share_<i>).
    - id: multi_band_curtailable_renewable
      parameters:
        - id: load_factor # Between 0 and 1
          time-dependent: true
          scenario-dependent: true
        - id: installed_capacity
          time-dependent: false
          scenario-dependent: false
        - id: generation_cost_1 # Negative price of band 1
          time-dependent: false
          scenario-dependent: false
        - id: curtailable_share_1 # Between 0 and 1
          time-dependent: true
          scenario-dependent: true
        - id: generation_cost_2
          time-dependent: false
          scenario-dependent: false
        - id: curtailable_share_2
          time-dependent: true
          scenario-dependent: true
        - id: generation_cost_3
          time-dependent: false
          scenario-dependent: false
        - id: curtailable_share_3
          time-dependent: true
          scenario-dependent: true
        - id: generation_cost_4
          time-dependent: false
          scenario-dependent: false
        - id: curtailable_share_4
          time-dependent: true
          scenario-dependent: true
        - id: generation_cost_5
          time-dependent: false
          scenario-dependent: false
        - id: curtailable_share_5
          time-dependent: true
          scenario-dependent: true
      variables:
        - id: curtailed_power_1
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * curtailable_share_1
          variable-type: continuous
        - id: curtailed_power_2
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * curtailable_share_2
          variable-type: continuous
        - id: curtailed_power_3
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * curtailable_share_3
          variable-type: continuous
        - id: curtailed_power_4
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * curtailable_share_4
          variable-type: continuous
        - id: curtailed_power_5
          lower-bound: 0
          upper-bound: load_factor * installed_capacity * curtailable_share_5
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: -(curtailed_power_1 + curtailed_power_2 + curtailed_power_3 + curtailed_power_4 + curtailed_power_5)
        - port: balance_port
          field: spillage_bound
          definition: 0
        - port: balance_port
          field: unsupplied_energy_bound
          definition: 0
      objective-contributions:
        - id: objective
          expression: -sum(generation_cost_1 * curtailed_power_1 + generation_cost_2 * curtailed_power_2 + generation_cost_3 * curtailed_power_3 + generation_cost_4 * curtailed_power_4 + generation_cost_5 * curtailed_power_5)
      extra-outputs:
        - id: total_curtailed_power
          expression: curtailed_power_1 + curtailed_power_2 + curtailed_power_3 + curtailed_power_4 + curtailed_power_5
        - id: generation_power
          expression: load_factor * installed_capacity - (curtailed_power_1 + curtailed_power_2 + curtailed_power_3 + curtailed_power_4 + curtailed_power_5)

    # Binding constraints on the nuclear clusters: one model per time step of the
    # legacy binding constraints (hourly, daily, weekly), the sense being given by
    # direction: 1 for "less" (lhs <= rhs), -1 for "greater" (lhs >= rhs).
    # Each port is connected to the balance_port of one cluster, with coefficient alpha_<cluster>.
    - id: nuclear_hourly_binding_constraint
      parameters: &nuclear_binding_constraint_parameters
        - id: direction # 1 for "less", -1 for "greater"
          time-dependent: false
          scenario-dependent: false
        - id: alpha_fr_nuclear_cp0_cp1_cp2
        - id: alpha_fr_nuclear_epr
        - id: alpha_fr_nuclear_n4
        - id: alpha_fr_nuclear_p4
        - id: alpha_fr_nuclear_peak1
        - id: alpha_fr_nuclear_peak2
        - id: alpha_fr_nuclear_peak3
        - id: alpha_y_nuc_modulation_nuclear_cp0_cp1_cp2
        - id: alpha_y_nuc_modulation_nuclear_epr
        - id: alpha_y_nuc_modulation_nuclear_n4
        - id: alpha_y_nuc_modulation_nuclear_p4
        - id: rhs
          time-dependent: true
          scenario-dependent: true
      ports: &nuclear_binding_constraint_ports
        - id: flow_fr_nuclear_cp0_cp1_cp2
          type: flow
        - id: flow_fr_nuclear_epr
          type: flow
        - id: flow_fr_nuclear_n4
          type: flow
        - id: flow_fr_nuclear_p4
          type: flow
        - id: flow_fr_nuclear_peak1
          type: flow
        - id: flow_fr_nuclear_peak2
          type: flow
        - id: flow_fr_nuclear_peak3
          type: flow
        - id: flow_y_nuc_modulation_nuclear_cp0_cp1_cp2
          type: flow
        - id: flow_y_nuc_modulation_nuclear_epr
          type: flow
        - id: flow_y_nuc_modulation_nuclear_n4
          type: flow
        - id: flow_y_nuc_modulation_nuclear_p4
          type: flow
      # A connection needs each field of the port type to be defined on one side:
      # the clusters define flow and the bounds, the area defines price.
      port-field-definitions: &nuclear_binding_constraint_port_field_definitions
        - port: flow_fr_nuclear_cp0_cp1_cp2
          field: price
          definition: 0
        - port: flow_fr_nuclear_epr
          field: price
          definition: 0
        - port: flow_fr_nuclear_n4
          field: price
          definition: 0
        - port: flow_fr_nuclear_p4
          field: price
          definition: 0
        - port: flow_fr_nuclear_peak1
          field: price
          definition: 0
        - port: flow_fr_nuclear_peak2
          field: price
          definition: 0
        - port: flow_fr_nuclear_peak3
          field: price
          definition: 0
        - port: flow_y_nuc_modulation_nuclear_cp0_cp1_cp2
          field: price
          definition: 0
        - port: flow_y_nuc_modulation_nuclear_epr
          field: price
          definition: 0
        - port: flow_y_nuc_modulation_nuclear_n4
          field: price
          definition: 0
        - port: flow_y_nuc_modulation_nuclear_p4
          field: price
          definition: 0
      binding-constraints:
        - id: hourly
          expression: direction * (alpha_fr_nuclear_cp0_cp1_cp2 * sum_connections(flow_fr_nuclear_cp0_cp1_cp2.flow) + alpha_fr_nuclear_epr * sum_connections(flow_fr_nuclear_epr.flow) + alpha_fr_nuclear_n4 * sum_connections(flow_fr_nuclear_n4.flow) + alpha_fr_nuclear_p4 * sum_connections(flow_fr_nuclear_p4.flow) + alpha_fr_nuclear_peak1 * sum_connections(flow_fr_nuclear_peak1.flow) + alpha_fr_nuclear_peak2 * sum_connections(flow_fr_nuclear_peak2.flow) + alpha_fr_nuclear_peak3 * sum_connections(flow_fr_nuclear_peak3.flow) + alpha_y_nuc_modulation_nuclear_cp0_cp1_cp2 * sum_connections(flow_y_nuc_modulation_nuclear_cp0_cp1_cp2.flow) + alpha_y_nuc_modulation_nuclear_epr * sum_connections(flow_y_nuc_modulation_nuclear_epr.flow) + alpha_y_nuc_modulation_nuclear_n4 * sum_connections(flow_y_nuc_modulation_nuclear_n4.flow) + alpha_y_nuc_modulation_nuclear_p4 * sum_connections(flow_y_nuc_modulation_nuclear_p4.flow)) <= direction * rhs

    - id: nuclear_daily_binding_constraint # Days of a weekly horizon (time steps 0 to 167)
      parameters: *nuclear_binding_constraint_parameters
      ports: *nuclear_binding_constraint_ports
      port-field-definitions: *nuclear_binding_constraint_port_field_definitions
      binding-constraints:
        - id: daily_1
          expression: direction * sum(0 .. 23, alpha_fr_nuclear_cp0_cp1_cp2 * sum_connections(flow_fr_nuclear_cp0_cp1_cp2.flow) + alpha_fr_nuclear_epr * sum_connections(flow_fr_nuclear_epr.flow) + alpha_fr_nuclear_n4 * sum_connections(flow_fr_nuclear_n4.flow) + alpha_fr_nuclear_p4 * sum_connections(flow_fr_nuclear_p4.flow) + alpha_fr_nuclear_peak1 * sum_connections(flow_fr_nuclear_peak1.flow) + alpha_fr_nuclear_peak2 * sum_connections(flow_fr_nuclear_peak2.flow) + alpha_fr_nuclear_peak3 * sum_connections(flow_fr_nuclear_peak3.flow) + alpha_y_nuc_modulation_nuclear_cp0_cp1_cp2 * sum_connections(flow_y_nuc_modulation_nuclear_cp0_cp1_cp2.flow) + alpha_y_nuc_modulation_nuclear_epr * sum_connections(flow_y_nuc_modulation_nuclear_epr.flow) + alpha_y_nuc_modulation_nuclear_n4 * sum_connections(flow_y_nuc_modulation_nuclear_n4.flow) + alpha_y_nuc_modulation_nuclear_p4 * sum_connections(flow_y_nuc_modulation_nuclear_p4.flow)) <= direction * sum(0 .. 23, rhs)
        - id: daily_2
          expression: direction * sum(24 .. 47, alpha_fr_nuclear_cp0_cp1_cp2 * sum_connections(flow_fr_nuclear_cp0_cp1_cp2.flow) + alpha_fr_nuclear_epr * sum_connections(flow_fr_nuclear_epr.flow) + alpha_fr_nuclear_n4 * sum_connections(flow_fr_nuclear_n4.flow) + alpha_fr_nuclear_p4 * sum_connections(flow_fr_nuclear_p4.flow) + alpha_fr_nuclear_peak1 * sum_connections(flow_fr_nuclear_peak1.flow) + alpha_fr_nuclear_peak2 * sum_connections(flow_fr_nuclear_peak2.flow) + alpha_fr_nuclear_peak3 * sum_connections(flow_fr_nuclear_peak3.flow) + alpha_y_nuc_modulation_nuclear_cp0_cp1_cp2 * sum_connections(flow_y_nuc_modulation_nuclear_cp0_cp1_cp2.flow) + alpha_y_nuc_modulation_nuclear_epr * sum_connections(flow_y_nuc_modulation_nuclear_epr.flow) + alpha_y_nuc_modulation_nuclear_n4 * sum_connections(flow_y_nuc_modulation_nuclear_n4.flow) + alpha_y_nuc_modulation_nuclear_p4 * sum_connections(flow_y_nuc_modulation_nuclear_p4.flow)) <= direction * sum(24 .. 47, rhs)
        - id: daily_3
