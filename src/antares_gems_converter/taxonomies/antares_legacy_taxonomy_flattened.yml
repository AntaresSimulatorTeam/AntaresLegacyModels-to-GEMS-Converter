taxonomy:
  id: antares_legacy_taxonomy
  description: GEMS taxonomy configuration for Antares Legacy Models.
  categories:

    - id: balance
      parameters:
        - id: unsupplied_energy_cost
          display-priority: high
        - id: spillage_cost
          display-priority: high
      variables:
        - id: unsupplied_energy
        - id: spilled_energy
      ports:
        - id: balance_port
      constraints:
        - id: balance
      extra-outputs:
        - id: price
        - id: imbalance_cost
        - id: is_loss_of_load
        - id: is_significant_loss_of_load
        - id: is_near_loss_of_load

    - id: generation
      parameters:
        - id: available_power
          display-priority: high
      ports:
        - id: balance_port
      properties:
        - id: technology
          display-priority: high

    - id: dispatchable_generation
      parameters:
        - id: available_power
          display-priority: high
        - id: num_units
          display-priority: high
        - id: max_power_per_unit
          display-priority: high
        - id: market_bid_cost
          display-priority: high
      ports:
        - id: balance_port
      variables:
        - id: generation_power
      extra-outputs:
        - id: prop_cost
        - id: non_prop_cost
        - id: actual_num_units_on
        - id: cluster_availability
        - id: min_gen_power
        - id: up_margin
        - id: co2_emissions
        - id: nh3_emissions
        - id: so2_emissions
        - id: nox_emissions
        - id: pm2_5_emissions
        - id: pm5_emissions
        - id: pm10_emissions
        - id: nmvoc_emissions
        - id: op1_emissions
        - id: op2_emissions
        - id: op3_emissions
        - id: op4_emissions
        - id: op5_emissions
        - id: profit
      properties:
        - id: technology
          display-priority: high
        - id: name

    - id: fatal_generation
      ports:
        - id: balance_port
      parameters:
        - id: available_power
          display-priority: high
      properties:
        - id: technology
          display-priority: high
      extra-outputs:
        - id: minus_generation
        - id: generation_power

    - id: renewable_fatal_generation
      ports:
        - id: balance_port
      parameters:
        - id: available_power
          display-priority: high
        - id: nominal_capacity
          display-priority: high
        - id: num_units
          display-priority: high
      extra-outputs:
        - id: minus_generation
        - id: generation_power
      properties:
        - id: technology
          display-priority: high
        - id: name

    - id: miscellaneous_fatal_generation
      ports:
        - id: balance_port
      parameters:
        - id: available_power
          display-priority: high
      extra-outputs:
        - id: minus_generation
        - id: generation_power
      properties:
        - id: technology
          display-priority: high
        - id: miscellaneous_type

    - id: consumption
      extra-outputs:
        - id: actual_load
      ports:
        - id: balance_port

    - id: fatal_consumption
      ports:
        - id: balance_port
      extra-outputs:
        - id: actual_load
      parameters:
        - id: load
          display-priority: high

    - id: storage
      parameters:
        - id: reservoir_capacity
          display-priority: high
        - id: nominal_withdrawal_capacity
          display-priority: high
        - id: nominal_injection_capacity
          display-priority: high
        - id: injection_efficiency
          display-priority: high
      ports:
        - id: balance_port
      variables:
        - id: injection_power
        - id: withdrawal_power
        - id: level

    - id: long_term_storage
      parameters:
        - id: reservoir_capacity
          display-priority: high
        - id: nominal_withdrawal_capacity
          display-priority: high
        - id: nominal_injection_capacity
          display-priority: high
        - id: injection_efficiency
          display-priority: high
      ports:
        - id: balance_port
      variables:
        - id: injection_power
        - id: withdrawal_power
        - id: level
        - id: overflow
      extra-outputs:
        - id: actual_inflows
        - id: level_percentage

    - id: long_term_storage_with_watervalues
      parameters:
        - id: reservoir_capacity
          display-priority: high
        - id: nominal_withdrawal_capacity
          display-priority: high
        - id: nominal_injection_capacity
          display-priority: high
        - id: injection_efficiency
          display-priority: high
      ports:
        - id: balance_port
      variables:
        - id: injection_power
        - id: withdrawal_power
        - id: level
        - id: overflow
      extra-outputs:
        - id: actual_inflows
        - id: level_percentage
        - id: hydro_shadow_price
        - id: bellman_value

    - id: short_term_storage
      parameters:
        - id: reservoir_capacity
          display-priority: high
        - id: nominal_withdrawal_capacity
          display-priority: high
        - id: nominal_injection_capacity
          display-priority: high
        - id: injection_efficiency
          display-priority: high
        - id: withdrawal_efficiency
          display-priority: high
        - id: initial_level
          display-priority: high
        - id: is_initial_level_optimized
          display-priority: high
      ports:
        - id: balance_port
      variables:
        - id: injection_power
        - id: withdrawal_power
        - id: level
      extra-outputs:
        - id: profit
      properties:
        - id: technology
          display-priority: high
        - id: name

    - id: link
      parameters:
        - id: direct_capacity
          display-priority: high
        - id: indirect_capacity
          display-priority: high
      ports:
        - id: out_port
        - id: in_port
      variables:
        - id: flow
      extra-outputs:
        - id: abs_flow
        - id: abs_congestion_fee
        - id: alg_congestion_fee
        - id: capacity_shadow_price
        - id: is_directly_congested
        - id: is_indirectly_congested
        - id: prop_cost
        - id: minus_flow
        - id: actual_loop_flow
