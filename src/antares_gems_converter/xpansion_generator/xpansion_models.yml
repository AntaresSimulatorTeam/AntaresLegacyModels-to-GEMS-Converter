library:
  id: xpansion_models
  description: Andromede V1 model library

  port-types:
    - id: capacity_port
      fields:
        - id: capacity
      thermal-capacity-connection:
        capacity-field: capacity
    - id: storage_capacity_port
      fields:
        - id: capacity

  models:
    - id: thermal_candidate_to_invest
      parameters:
        - id: gisement_total
          time-dependent: false
          scenario-dependent: false
        - id: max_unit
          time-dependent: false
          scenario-dependent: false
        - id: unit_size
          time-dependent: false
          scenario-dependent: false
        - id: cost_per_year
          time-dependent: false
          scenario-dependent: false
        - id: coef_disponibilite
          time-dependent: true
          scenario-dependent: true
      variables:
        - id: units_to_invest
          lower-bound: 0
          upper-bound: max_unit
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: capacity_port
          type: capacity_port
      port-field-definitions:
        - port: capacity_port
          field: capacity
          definition: units_to_invest*unit_size*coef_disponibilite
      constraints:
        - id: capa_max
          expression: units_to_invest*unit_size <= gisement_total
      objective-contributions:
        - id: obj
          expression: units_to_invest*cost_per_year

    - id: battery_candidate_to_invest
      parameters:
        - id: gisement_total
          time-dependent: false
          scenario-dependent: false
        - id: cost_per_year
          time-dependent: false
          scenario-dependent: false
        - id: Pmax
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: capacity_to_invest
          lower-bound: 0
          upper-bound: gisement_total
          time-dependent: false
          scenario-dependent: false
      ports:
        - id: capacity_port
          type: storage_capacity_port
      port-field-definitions:
        - port: capacity_port
          field: capacity
          definition: capacity_to_invest
      objective-contributions:
        - id: obj
          expression: cost_per_year*capacity_to_invest/Pmax
