catalog:
  id: antares_legacy_thermal_cluster_catalog

  taxonomy: antares_legacy_taxonomy

  location:
    taxonomy-category: balance

  metrics-definition:
    - id: GENERATION
      terms:
        - taxonomy-category: dispatchable_generation
          output-id: generation_power
          location-port: balance_port
      breakdown:
        - key: name
      terms-operator: sum
      time-operator: sum

    - id: MIN_GEN
      terms:
        - taxonomy-category: dispatchable_generation
          output-id: min_gen_power
          location-port: balance_port
      breakdown:
        - key: name
      terms-operator: sum
      time-operator: sum

    - id: PROFIT
      terms:
        - taxonomy-category: dispatchable_generation
          output-id: profit
          location-port: balance_port
      breakdown:
        - key: name
      terms-operator: sum
      time-operator: sum

    - id: NODU
      terms:
        - taxonomy-category: dispatchable_generation
          output-id: actual_num_units_on
          location-port: balance_port
      breakdown:
        - key: name
      terms-operator: sum
      time-operator: sum

    - id: NP_COST
      terms:
        - taxonomy-category: dispatchable_generation
          output-id: non_prop_cost
          location-port: balance_port
      breakdown:
        - key: name
      terms-operator: sum
      time-operator: sum
