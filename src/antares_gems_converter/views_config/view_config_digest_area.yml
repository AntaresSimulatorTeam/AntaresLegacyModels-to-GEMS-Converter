view:

  # Mirrors the legacy digest (mc-all/grid/digest.txt), area and district part: the
  # expected value over the whole simulated period of each variable. The metrics
  # commented below differ from the digest.

  id: view_digest_area

  taxonomy: antares_legacy_taxonomy

  scope:
    location:
      taxonomy-category: balance # category of the taxonomy, the components of which serve as locational objects. Main case is 'area'.
    # no location-filter: the digest ignores the geographic trimming
    extra-locations:
    # to be filled in: one district_<id> per district with outputs

  aggregations-patterns:
    - id: year_all # the digest values are the 'exp' rows
      time-granularity: year
      scenario: true

  metrics: # metrics selected among the catalogs, as <catalog_id>.<metric_id>: keep only the ones printed
    - id: antares_legacy_area_catalog.OV_COST
    - id: antares_legacy_area_catalog.OP_COST
    - id: antares_legacy_area_catalog.MRG_PRICE
    - id: antares_legacy_area_catalog.CO2_EMIS
    - id: antares_legacy_area_catalog.NH3_EMIS
    - id: antares_legacy_area_catalog.SO2_EMIS
    - id: antares_legacy_area_catalog.NOX_EMIS
    - id: antares_legacy_area_catalog.PM2_5_EMIS
    - id: antares_legacy_area_catalog.PM5_EMIS
    - id: antares_legacy_area_catalog.PM10_EMIS
    - id: antares_legacy_area_catalog.NMVOC_EMIS
    - id: antares_legacy_area_catalog.OP1_EMIS
    - id: antares_legacy_area_catalog.OP2_EMIS
    - id: antares_legacy_area_catalog.OP3_EMIS
    - id: antares_legacy_area_catalog.OP4_EMIS
    - id: antares_legacy_area_catalog.OP5_EMIS
    - id: antares_legacy_area_catalog.LOAD
    - id: antares_legacy_area_catalog.RES_LOAD
    - id: antares_legacy_area_catalog.DTG_BY_TECHNOLOGY
    - id: antares_legacy_area_catalog.BALANCE
    - id: antares_legacy_area_catalog.RES_GENERATION
    - id: antares_legacy_area_catalog.STS_INJECTION
    - id: antares_legacy_area_catalog.STS_WITHDRAWAL
    - id: antares_legacy_area_catalog.STS_LEVEL
    - id: antares_legacy_area_catalog.UNSP_ENRG
    - id: antares_legacy_area_catalog.SPIL_ENRG
    - id: antares_legacy_area_catalog.NODU
    - id: antares_legacy_area_catalog.NP_COST
    - id: antares_legacy_area_catalog.AVL_DTG
    - id: antares_legacy_area_catalog.DTG_MRG
    # LOLD: district: the legacy digest counts an hour once if any area is short
    # (spatialAggregateSumThen1IfPositive); GVB adds the areas
    - id: antares_legacy_area_catalog.LOLD
    # LOLP: the legacy digest counts a year as 100 % if any hour is short
    # (computeStatisticsOrForTheCurrentYear); GVB `avg` gives a share of hours
    - id: antares_legacy_area_catalog.LOLP
    # NPCAP_HOURS: district: same difference as LOLD
    - id: antares_legacy_area_catalog.NPCAP_HOURS
    - id: antares_legacy_area_catalog.ROW_BAL
    - id: antares_legacy_area_catalog.MISC_NDG
    - id: antares_legacy_area_catalog.PSP
    - id: antares_legacy_area_catalog.H_STOR
    - id: antares_legacy_area_catalog.H_PUMP
    - id: antares_legacy_area_catalog.H_OVFL
    - id: antares_legacy_area_catalog.H_INFL
    # H_LEV: district: the legacy digest gives N/A; GVB gives an average
    - id: antares_legacy_area_catalog.H_LEV
    # H_VAL: different from the Antares variable on purpose (see the catalog)
    - id: antares_legacy_area_catalog.H_VAL
    # H_COST: different from the Antares variable on purpose (see the catalog)
    - id: antares_legacy_area_catalog.H_COST
