view:

  # Mirrors the legacy digest (mc-all/grid/digest.txt), area and district part: the
  # expected value over the whole simulated period of each variable.

  id: view_digest_area

  taxonomy: antares_legacy_taxonomy

  scope:
    location:
      taxonomy-category: balance # category of the taxonomy, the components of which serve as locational objects. Main case is 'area'.
    # no location-filter: the digest ignores the geographic trimming
    extra-locations:
    # to be filled in: one district_<id> per district with outputs

  aggregations-patterns:
    - id: year_all # the digest values are the 'exp' rows
      time-granularity: year
      scenario: true

  metrics: # the metrics of the catalog that match a digest column, as <catalog_id>.<metric_id>: keep only the ones printed
    - id: antares_legacy_area_catalog.OV_COST
    - id: antares_legacy_area_catalog.OP_COST
    - id: antares_legacy_area_catalog.MRG_PRICE
    - id: antares_legacy_area_catalog.CO2_EMIS
    - id: antares_legacy_area_catalog.NH3_EMIS
    - id: antares_legacy_area_catalog.SO2_EMIS
    - id: antares_legacy_area_catalog.NOX_EMIS
    - id: antares_legacy_area_catalog.PM2_5_EMIS
    - id: antares_legacy_area_catalog.PM5_EMIS
    - id: antares_legacy_area_catalog.PM10_EMIS
    - id: antares_legacy_area_catalog.NMVOC_EMIS
    - id: antares_legacy_area_catalog.OP1_EMIS
    - id: antares_legacy_area_catalog.OP2_EMIS
    - id: antares_legacy_area_catalog.OP3_EMIS
    - id: antares_legacy_area_catalog.OP4_EMIS
    - id: antares_legacy_area_catalog.OP5_EMIS
    - id: antares_legacy_area_catalog.LOAD
    - id: antares_legacy_area_catalog.RES_LOAD
    - id: antares_legacy_area_catalog.DTG_BY_TECHNOLOGY
    - id: antares_legacy_area_catalog.BALANCE
    - id: antares_legacy_area_catalog.RES_GENERATION
    - id: antares_legacy_area_catalog.STS_INJECTION
    - id: antares_legacy_area_catalog.STS_WITHDRAWAL
