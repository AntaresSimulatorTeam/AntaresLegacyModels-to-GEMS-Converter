[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "antares-legacy-gems-converter"
version = "0.3.0"
description = "Convert Antares Legacy studies to GEMS format"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Antoine Oustry @aoustry"},
    {name = "Dušan Paripović @dusanparipovic"},
    {name = "Nikola Ilić @nikolaredstork"},
    {name = "Thomas Bittar @tbittar"},
    {name = "Juliette Gerbaux @Juliette-Gerbaux"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "antares_craft==0.15.1",
    "antares-study-version==1.0.20",
    "antares-timeseries-generation==0.1.9",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pydantic>=2.11.10",
    "gemspy==0.1.2",
    "PyYAML>=6.0.3",
]

[project.urls]
Issues = "https://github.com/AntaresSimulatorTeam/AntaresLegacyModels-to-GEMS-Converter/issues"

[project.scripts]
antares-to-gems = "antares_gems_converter.input_converter.src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "mypy>=2.1.0",
    "types-pyyaml>=6.0.12",
    "black>=23.7.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antares_gems_converter = ["**/*.yaml", "**/*.yml"]

[tool.black]
line-length = 88
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
